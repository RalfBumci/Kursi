<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headings in HTML</title>
    <style>
        h1{
            color:red;
            font-family: Arial, Helvetica, sans-serif;
        }
        h2{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>BIG</h1>
    <h2>2nd</h2>
    <h3>3rd</h3>
    <h4>4th</h4>
    <h5>5th</h5>
    <h6>last</h6>
</body>
</html>
