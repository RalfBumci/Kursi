<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8</title>
    <style>
        
        #text{
            position: absolute;
            top: 100px;
            left: 100px;
            font-size: 3em;
            animation-name: reveal;
            animation-duration: 3s;
            font-weight: bold;
        }
        #image {
            position: absolute;
            left: 200px;
            top: 200px;
            width: 64px;
            height: 55px;
            background-image: url(walk-cycle.png);
            animation: moveX .5s steps(9) infinite;
            transform: scale(200%);
            
        }
        @keyframes moveX {
            from{background-position-x: 0px;}
            to{background-position: -576px;}
        
        }
        @keyframes reveal {
            0%{transform: scale(0%);}
            100%{transform: scale(100%);}
            
        }
    </style>
</head>
<body>
    <div id="text">Walking cycle</div>
    <div id="image">

    </div>
</body>
</html>
