<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6</title>
</head>
<body>
    <form action="#" method="post">
        <label for="CustomerName">Name</label>
        <input type="text" id="CustomerName"> <br>
        <label for="CustomerSurname">Surname</label>
        <input type="text" id="CustomerSurname"><br>
        <label for="TypeOfCoffee">What type of coffee would you like?</label>
        <input type="radio" id="Regular"   name="TypeOfCoffee">Regular 
        <input type="radio" id="Decaf" name="TypeOfCoffee"> Decaf
        <input type="radio" id="50/50" name="TypeOfCoffee"> 50/50 <br>
        <label for="CoffeeTemp">Choose your coffee temperature:</label>
        <input type="radio" id="Hot" name="CoffeeTemp">Hot
        <input type="radio" id="Iced" name="CoffeeTemp"> Iced <br>
        <label for="TypeOfSweetener">What type of sweetener would you like?</label>
        <input type="radio" id="Sugar" name="TypeOfSweetener"> Sugar 
        <input type="radio" id="Splenda" name="TypeOfSweetener"> Splenda
        <input type="radio" id="Equal" name="TypeOfSweetener"> Equal
        <input type="radio" id="Sweet n'Low" name="TypeOfSweetener"> Sweet N'Low
        <input type="radio" id="Stevia" name="TypeOfSweetener"> Stevia <br>
        <label for="TypeOfCreamer">Now choose your creamer</label>
        <input type="radio" id="Half & Half" name="TypeOfCreamer"> Half & Half
        <input type="radio" id="Whole Milk" name="TypeOfCreamer"> Whole Milk
        <input type="radio" id="Skim Milk" name="TypeOfCreamer"> Skim Milk
        <input type="radio" id="Almond Milk" name="TypeOfCreamer"> Almond Milk
        <input type="radio" id="Oat Milk" name="TypeOfCreamer"> Oat Milk <br>
        <label for="Size"></label>







    </form>
</body>
</html>
