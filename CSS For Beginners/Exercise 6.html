<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6</title>
    <style>
        body {
            background-image: url(Buckstars.webp);
        }

        article {
            background-color: rgba(11, 11, 141, 0.664);

        }

        form {
            margin: 0 auto;
            border: 5px solid blue;
            background-color: rgba(0, 255, 255, 0.759);
            height: max-content;
            width: fit-content;
            padding: 30px;
        }

        label {
            margin-bottom: 100px;
            font-size: 3em;
            margin-top: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }

        #Title {
            font-size: 2em;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            text-shadow: 4px 4px aqua;

        }

        #TypeOfCoffee,
        #CoffeeTemp,
        #TypeOfSweetener,
        #TypeOfCreamer,
        #Size {
            font-size: 2em;
            margin-top: 30px;
            margin-bottom: 30px;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        #Receive {
            font-size: 3em;
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 15px;
            text-align: center;
        }

        input[type="text"],
        input[type="tel"] {
            width: 80%;
            height: 1.5em;
            margin-bottom: 30px;
            margin-top: 15px;
            font-size: 2em;
        }

        input[type="radio"] {
            width: 2.5em;
            height: 2.5em;
            margin-left: 25px;
            accent-color: blue;
            cursor: pointer;
        }

        button {
            font-size: 2em;
            font-weight: bold;
            background-color: blue;
            color: aqua;
            padding: 15px;
            border-radius: 30px;
            border: solid blue;
            cursor: pointer;
            position: relative;
            left: 25%;
        }
    </style>
</head>

<body>
    <article>
        <form action="#" method="post">
            <div id="text">
                <div id="Title">
                    <h1>Welcome to Buckstars!</h1>
                    <h2>Leave your order below:</h2>
                </div>
                <label for="TypeOfCoffee">What type of coffee would you like?</label><br>
                <div id="TypeOfCoffee">
                    <input type="radio" id="Regular" name="TypeOfCoffee" required>Regular
                    <input type="radio" id="Decaf" name="TypeOfCoffee"> Decaf
                    <input type="radio" id="50/50" name="TypeOfCoffee"> 50/50 <br>
                </div>
                <label for="CoffeeTemp">Choose your coffee temperature:</label><br>
                <div id="CoffeeTemp">
                    <input type="radio" id="Hot" name="CoffeeTemp" required>Hot
                    <input type="radio" id="Iced" name="CoffeeTemp"> Iced <br>
                </div>

                <label for="TypeOfSweetener">What type of sweetener would you like?</label><br>
                <div id="TypeOfSweetener">
                    <input type="radio" id="Sugar" name="TypeOfSweetener" required> Sugar
                    <input type="radio" id="Splenda" name="TypeOfSweetener"> Splenda
                    <input type="radio" id="Equal" name="TypeOfSweetener"> Equal
                    <input type="radio" id="Sweet n'Low" name="TypeOfSweetener"> Sweet N'Low
                    <input type="radio" id="Stevia" name="TypeOfSweetener"> Stevia <br>
                </div>
                <label for="TypeOfCreamer">Now choose your creamer</label><br>
                <div id="TypeOfCreamer">
                    <input type="radio" id="Half & Half" name="TypeOfCreamer" required> Half & Half
                    <input type="radio" id="Whole Milk" name="TypeOfCreamer"> Whole Milk
                    <input type="radio" id="Skim Milk" name="TypeOfCreamer"> Skim Milk
                    <input type="radio" id="Almond Milk" name="TypeOfCreamer"> Almond Milk
                    <input type="radio" id="Oat Milk" name="TypeOfCreamer"> Oat Milk <br>
                </div>
                <label for="Size">What size would you like your order to be in?</label><br>
                <div id="Size">
                    <input type="radio" id="Small" name="Size" required> Small
                    <input type="radio" id="Medium" name="Size"> Medium
                    <input type="radio" id="Large" name="Size"> Large <br>
                </div>
                <label for="Receive"></label><br>
                <div id="Receive">
                    <input type="radio" id="Sit in" name="Recieve" required> Sit in
                    <input type="radio" id="To go" name="Recieve"> To go <br>
                </div>
                <div id="Details">
                    <label for="CustomerName">Name</label><br>
                    <div id="Name">
                        <input type="text" id="CustomerName" required> <br>
                    </div>
                    <label for="CustomerNumber">Leave your phone number so we can contact you:</label><br>
                    <div id="Phone">
                        <input type="tel" id="Phone number" name="CustomerNumber" placeholder="###-###-####" required>
                    </div>

                </div>

                <button type="submit">Finalise your order</button>





        </form>
    </article>
</body>

</html>
