<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3</title>
    <style>
    
        #box1 {
            box-sizing: content-box;
            border: 5px black dotted;
            margin-top: 20px;
            width: 350px;
            margin-bottom: 40px;
            margin-left: 25px;
            padding: 10px;
            background-color: orange;
        }
        #box2 {
            box-sizing: border-box;
            border: 2px solid black;
            margin-top: 10px;
            width: 200px;
            margin-bottom: 20px;
            margin-left: 10px;
            padding: 10px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div id="box1"></div>
    <div id="box2"></div>
</body>
</html>
