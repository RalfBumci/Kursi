<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
</head>
<body>
    <h2>Choose a day</h2>
    <p>1. Sunday <br>
    2. Monday <br>
    3. Tuesday <br>
    4. Wednesday <br>
    5. Thursday<br>
    6. Friday <br>
    7. Saturday </p>
    <br>

    <h2>Choose a fruit</h2>
    <p>1. Apple      $.99<br>
    2. Pear          $.79<br>
    3. Orange        $1.19<br>
    4. Grapes        $1.49<br>
    5. Grapefruit    $1.79<br>
    6. Kiwi          $.79<br>
    7. Apricots      $1.29</p>
    <br><br>
    <div id="output"></div>
    <script>
        var DelayInMilliseconds = 1000;

        setTimeout(function() {
        let option = prompt("Choose a day (1-7)");
        switch (option){
            case "1":
            console.log("Sunday");
            break;
            case "2":
            console.log("Monday");
            break;
            case "3":
            console.log("Tuesday");
            break;
            case "4":
            console.log("Wednesday");
            break;
            case "5":
            console.log("Thursday");
            break;
            case "6":
            console.log("Friday");
            break;
            case "7":
            console.log("Saturday");
        }



        let fruit = prompt ("Choose the fruit you would like?");
        let amount = prompt("How many do you want?");
        const apple = 0.99;
        const pear = 0.79;
        const orange = 1.19;
        const grapes = 1.49;
        const grapefruit = 1.79;
        const kiwi = 0.79;
        const apricots = 1.29;

        switch (fruit){
            case "1":
                document.getElementById("output").innerHTML = 
                amount + " Apple $" + amount*apple;
                break;
            case "2":
                document.getElementById("output").innerHTML = 
                amount + " Pear $" + amount*pear;
                break;
            case "3":
                document.getElementById("output").innerHTML = 
                amount + " Orange $" + amount*orange;
                break;
            case "4":
                document.getElementById("output").innerHTML = 
                amount + " Grapes $" + amount*grapes;
                break;
            case "5":
                document.getElementById("output").innerHTML = 
                amount + " Grapefruit $" + amount*grapefruit;
                break;
            case "6":
                document.getElementById("output").innerHTML = 
                amount + " Kiwi $" + amount*kiwi;
                break;
            case "7":
                document.getElementById("output").innerHTML = 
                amount + " Apricots $" + amount*apricots;   
        }

    }, DelayInMilliseconds);
    </script>
</body>
</html>
