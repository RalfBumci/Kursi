<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7 part 2</title>
    <style>
        body {
            background-color: darkblue;

        }

        section {
            border: 1px solid black;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
            max-width: 300px;
            margin: 0 auto;
            background-color: white;
        }

        input {
            width: 100%;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            background-color: lime;
            color: white;
            font-weight: bold;
            height: 30px;
            border: none;
            cursor: pointer;
            font-size: large;
        }

        h1,
        h3{
            text-align: center;
        }

        h3 {
            color: white;
            font-size: small;
            font-weight: normal;
        }

        a {
            color: lime;
        }
    </style>
</head>

<body>

    <section>
        <h1>
            Login
        </h1>
        <form action="#" method="post">

            <label for="userEmail">Email</label>
            <input type="email" id="userEmail"><br>
            <label for="userPassword">Password</label>
            <input type="password" id="userPassword"><br>
            <button type="submit">Submit</button> <br>
        </form>
    </section>
    <h3>
        Not have an account? <a href="Exercise 7.html">Sign Up Here</a>
    </h3>


</body>

</html>
