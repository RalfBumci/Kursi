<body>
    <h1>A poem by A.E. Housman</h1>
    <h2>With Rue My Heart is Laden</h2>
    <h4>With rue my heart is laden <br>
    For golden friends I had, <br>
    For many a rose-lipt maiden <br>
    And many a lightfoot lad.</h4>
    <h4>By brooks too broad for leaping <br>
    The lightfoot boys are laid; <br>
    The rose-lipt girls are sleeping <br>
    In fields where roses fade.</h4>
