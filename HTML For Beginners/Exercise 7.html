<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7 part 1</title>
    <style>
        body {
            background-color: darkblue;

        }

        section {
            border: 1px solid black;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
            max-width: 300px;
            margin: 0 auto;
            background-color: white;
        }

        input {
            width: 100%;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            background-color: lime;
            color: white;
            font-weight: bold;
            height: 30px;
            border: none;
            cursor: pointer;
            font-size: large;
        }

        aside {
            font-size: smaller;
        }

        h1,
        h3 ,h4{
            text-align: center;
        }

        h3 {
            color: white;
            font-size: small;
            font-weight: normal;
        }

        a {
            color: lime;
        }
    </style>
</head>

<body>

    <section>
        <h1>
            Sign Up
        </h1>
        <h4>It's free and only takes a minute </h4>
        <form action="#" method="post">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName"><br>
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName"><br>
            <label for="userEmail">Email</label>
            <input type="email" id="userEmail"><br>
            <label for="userPassword">Password</label>
            <input type="password" id="userPassword"><br>
            <label for="userConfirm">Confirm Password</label>
            <input type="password" id="userConfirm"> <br>
            <button type="submit">Submit</button> <br>
        </form>
        <aside>
            <p>By clicking the Sign Up button, you agree to our <a href="#">Terms and Condition</a> and <a
                    href="#">Policy
                    Privacy</a>.</p>
        </aside>
    </section>
    <h3>
        Already have an account? <a href="Exercise 7part 2.html">Login here</a>
    </h3>


</body>

</html>
